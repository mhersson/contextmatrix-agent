# CI pipeline for contextmatrix-agent.
#
# Gates every pull_request on the full quality bar. Pushes to main skip the
# checks (already validated on the PR) - branch protection requires the check
# jobs to pass before merge.
#
# GitHub Actions are pinned to exact release tags; Dependabot
# (.github/dependabot.yml) keeps them current.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: make test

      - name: go test -race
        run: make test-race

  lint:
    name: lint
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Install golangci-lint at the version the Makefile pins, so CI and a
      # local `make lint` use the same release.
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          VERSION=$(grep '^GOLANGCI_LINT_VERSION' Makefile | head -1 | awk '{print $NF}')
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "${VERSION}"

      - name: golangci-lint
        run: make lint

  build:
    name: build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: make build

  govulncheck:
    name: govulncheck
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Install govulncheck at the version the Makefile pins, so CI and a local
      # run use the same release.
      - name: Install govulncheck
        run: |
          set -euo pipefail
          VERSION=$(grep '^GOVULNCHECK_VERSION' Makefile | head -1 | awk '{print $NF}')
          go install "golang.org/x/vuln/cmd/govulncheck@${VERSION}"

      # Fails only on symbol-level findings (the code actually calls the
      # vulnerable symbol) that also have an upstream fix available.
      # Module/package-level findings without a callable trace are noise from
      # transitive deps and don't block CI. A run whose JSON carries no config
      # message did not scan, so it fails rather than passing on empty output.
      - name: Run govulncheck (fail only on callable, fixable findings)
        run: |
          set -euo pipefail
          govulncheck -format=json ./... > /tmp/vuln.json 2>&1 || true

          if ! jq -e -s 'any(.[]; .config != null)' /tmp/vuln.json > /dev/null; then
            echo "::error::govulncheck produced no config message; the scan did not run."
            exit 1
          fi

          FIXABLE=$(jq -s '[.[] | select(.finding != null
                                          and (.finding.fixed_version // "") != ""
                                          and (.finding.trace | any((.function // "") != "")))] | length' /tmp/vuln.json)

          echo "callable + fixable findings: ${FIXABLE}"

          govulncheck ./... || true

          if [ "${FIXABLE:-0}" -gt 0 ]; then
            echo "::error::Callable, fixable vulnerabilities detected. See output above."
            exit 1
          fi

          echo "No callable, fixable vulnerabilities. Remaining findings are uncalled by this code or have no upstream fix."

  hadolint:
    name: hadolint
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/Dockerfile.worker

  worker-image-scan:
    name: worker-image-scan
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build worker image
        run: make docker-worker

      - name: Check revision label
        run: |
          set -euo pipefail
          WANT=$(git rev-parse HEAD)
          GOT=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' contextmatrix-agent-worker:dev)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::Worker image revision label is '$GOT', want '$WANT'."
            exit 1
          fi

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: contextmatrix-agent-worker:dev
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          # Only run the vulnerability scanner. The default secret scanner
          # flags gosec regex literals (shipped with golangci-lint) as
          # hardcoded credentials - false positives.
          scanners: vuln
          trivyignores: .trivyignore
